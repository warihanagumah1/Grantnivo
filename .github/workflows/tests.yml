name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, pdo_sqlite

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'

      - name: Install the pinned package manager
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          pnpm install --frozen-lockfile

      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build production assets
        run: pnpm run build

      - name: Test frontend behavior
        run: pnpm run test:frontend

      - name: Run CI Checks
        run: composer ci:check
